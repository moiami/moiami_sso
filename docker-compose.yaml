name: 'Moimai-sso'
services:

  postgres-sso-service:
    image: postgres:latest
    restart: unless-stopped
    ports:
      - "5433:5432"
    environment:
      POSTGRES_USERNAME: postgres
      POSTGRES_PASSWORD: root
      POSTGRES_DB: postgres
    command: ["postgres", "-p", "5433"]

  sso:
    build: .
    restart: unless-stopped
    ports:
      - "8001:8001"
    depends_on:
      - postgres-sso-service
    environment:
      - DATABASE_URL=postgresql+asyncpg://postgres:root@postgres-sso-service:5433/postgres
      - CLIENT_ID=caddy-portal
      - ISSUER_URL=http://localhost:8001
      - PRIVATE_KEY_PATH=/app/keys/private.pem
      - PUBLIC_KEY_PATH=/app/keys/public.pem
    volumes:
      - ./keys:/app/keys:ro